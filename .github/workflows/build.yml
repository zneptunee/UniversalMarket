name: Build UniversalMarket

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Show resolved dependency tree
        run: mvn -B -ntp dependency:tree

      - name: Build
        run: mvn -B -ntp clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: UniversalMarket-jar
          path: target/UniversalMarket.jar
          if-no-files-found: error
